name: Security regression tests

on:
  push:
    branches:
      - staging-phase0b
      - security-hardening/**
  pull_request:
    branches:
      - staging-phase0b

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Type-check
        run: npm run lint
